// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

/*
 * Keep Gradle's build output outside the project folder.
 *
 * A checkout that lives in a cloud-synced folder (OneDrive, Dropbox, Google
 * Drive) breaks the Android build in ways that look like corrupt resources:
 * the sync client holds a lock on files the resource merger is writing, and
 * the build fails with `AccessDeniedException` on its own intermediate
 * directories. Writing the intermediates to a plain local directory removes the
 * whole class of problem.
 *
 * Override the location with the `ANDROID_BUILD_DIR` environment variable.
 */
def externalBuildPath = System.getenv('ANDROID_BUILD_DIR')
if (!externalBuildPath) {
    externalBuildPath = new File(
        System.getProperty('user.home'),
        '.anusree-tracker-android-build'
    ).absolutePath
}
def externalBuildRoot = new File(externalBuildPath)

allprojects {
    layout.buildDirectory.set(new File(externalBuildRoot, project.path.replace(':', '/').replaceAll('^/', '')))
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Capacitor 8 compiles with a Java 21 toolchain. Its plugin modules declare one
// themselves (`kotlin { jvmToolchain(21) }`), but the core `capacitor-android`
// library and this app only set `compileOptions` — without a toolchain they would
// compile with whatever JDK happens to run Gradle and fail with “invalid source
// release: 21”. Pinning the toolchain on every Android module makes the JDK 21
// that `settings.gradle` provisions (Foojay) apply consistently, everywhere.
subprojects { subproject ->
    ['com.android.application', 'com.android.library'].each { pluginId ->
        subproject.plugins.withId(pluginId) {
            subproject.java {
                toolchain {
                    languageVersion = JavaLanguageVersion.of(21)
                }
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
