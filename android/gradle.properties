# Project-wide Gradle settings.
#
# The Android build is run by `npm run android:build`, which sets JAVA_HOME to a
# detected JDK before invoking this wrapper, so no machine-specific path is
# committed here. Capacitor 8 needs a Java 21 *toolchain*; the two switches below
# let Gradle auto-detect one or download it (via the Foojay resolver declared in
# `settings.gradle`) when the machine only has an older JDK.
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=true

# AndroidX is required by every Capacitor plugin.
android.useAndroidX=true

# Keep the daemon on a fixed heap so builds are reproducible across machines.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
