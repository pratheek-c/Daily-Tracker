// Capacitor 8 compiles with a Java 21 toolchain (`kotlin { jvmToolchain(21) }`
// in the plugin modules). Rather than requiring a JDK 21 to be installed and
// pinned by hand, the Foojay resolver lets Gradle detect one anywhere on the
// machine or download it on demand — see `gradle.properties` for the switches.
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.10.0'
}

include ':app'
include ':capacitor-cordova-android-plugins'
project(':capacitor-cordova-android-plugins').projectDir = new File('./capacitor-cordova-android-plugins/')

apply from: 'capacitor.settings.gradle'
