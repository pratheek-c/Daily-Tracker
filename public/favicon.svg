<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" role="img" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8C8DC" />
      <stop offset="100%" stop-color="#E8DDF8" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="112.64" ry="112.64" fill="url(#bg)" />
  <svg x="0" y="0" width="512" height="512" viewBox="0 0 100 100">
    
    <g transform="translate(50 50) scale(0.9) translate(-50 -50)">
      <!-- ears -->
      <path d="M24 54 L18 12 L54 40 Z" fill="#FFFFFF" stroke="#F2A7C3" stroke-width="2.4" stroke-linejoin="round" />
      <path d="M76 54 L82 12 L46 40 Z" fill="#FFFFFF" stroke="#F2A7C3" stroke-width="2.4" stroke-linejoin="round" />
      <path d="M28 47 L24 22 L49 39 Z" fill="#F8C8DC" />
      <path d="M72 47 L76 22 L51 39 Z" fill="#F8C8DC" />

      <!-- head -->
      <ellipse cx="50" cy="58" rx="30" ry="26" fill="#FFFFFF" stroke="#F2A7C3" stroke-width="2.4" />

      <!-- eyes -->
      <circle cx="39.5" cy="47.5" r="5" fill="#37313D" />
      <circle cx="60.5" cy="47.5" r="5" fill="#37313D" />
      <circle cx="41.4" cy="44.4" r="1.8" fill="#FFFFFF" />
      <circle cx="62.4" cy="44.4" r="1.8" fill="#FFFFFF" />

      <!-- cheeks -->
      <ellipse cx="28.6" cy="66.5" rx="5.6" ry="3.6" fill="#F8C8DC" />
      <ellipse cx="71.4" cy="66.5" rx="5.6" ry="3.6" fill="#F8C8DC" />

      <!-- nose and smile -->
      <path d="M46.8 63.5 L53.2 63.5 L50 68.5 Z" fill="#F2A7C3" />
      <path d="M45 72 Q50 76 55 72" fill="none" stroke="#37313D" stroke-width="1.8" stroke-linecap="round" opacity="0.5" />

      <!-- crown, sitting on the forehead -->
      <path
        d="M38 33 L43.5 17 L50.5 32 L57.5 16 L62 33 Z"
        fill="#F3D27A"
        stroke="#DCB25A"
        stroke-width="1.4"
        stroke-linejoin="round"
      />
      <circle cx="50.5" cy="17.5" r="2" fill="#F2A7C3" />
    </g>
  
  </svg>
</svg>